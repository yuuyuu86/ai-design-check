<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ai-design-check</title>
<style>
:root{color-scheme:light;--ink:#222823;--muted:#59625c;--line:#d9dfd9;--paper:#f7f8f5;--accent:#236047;--accent-light:#e0efe4}
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:var(--ink);font-family: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,input,select{outline-offset:3px}a{color:inherit}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:var(--paper)}.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:-.02em}.mark{width:28px;height:28px;border:1.5px solid var(--accent);position:relative}.mark:after{content:"";position:absolute;left:7px;top:4px;width:8px;height:13px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(40deg)}.local{font-size:13px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:64px 40px 80px}.intro{display:flex;justify-content:space-between;align-items:end;gap:32px;margin-bottom:48px}.intro h1{font-size:clamp(32px,4vw,48px);font-weight:500;letter-spacing:-.04em;line-height:1.3;margin:0}.intro p{margin:12px 0 0;color:var(--muted)}.intro-note{font-size:13px;color:var(--muted);text-align:right}.workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);border:1px solid #ccd4cc;background:var(--paper);min-height:470px}.form-area,.result-area{padding:40px}.form-area{border-right:1px solid var(--line)}.section-heading{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:32px}.section-heading .number{font:13px ui-monospace,monospace;color:var(--accent)}h2{font-size:20px;font-weight:500;margin:0}.description{color:var(--muted);margin:-12px 0 28px}label{display:block;font-weight:600;font-size:14px;margin:24px 0 8px}select,input{display:block;width:100%;height:52px;padding:0 16px;color:var(--ink);background:white;border:1px solid #bbc6bc;border-radius:4px}input::placeholder{color:#7b857e}.hint{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:24px}.action{display:flex;align-items:center;gap:20px;margin-top:40px}button{min-height:52px;padding:0 28px;border:0;border-radius:4px;background:var(--accent);color:white;font-weight:600;cursor:pointer}button:hover{background:#174c36}button:disabled{opacity:.55;cursor:wait}.action small{color:var(--muted)}.result-area{display:flex;flex-direction:column}.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;color:var(--muted)}.sample{width:100%;max-width:320px;border:1px solid #c8d8cb;background:#e7f0e8;padding:20px;margin-bottom:28px}.sample-line{height:8px;background:#a5c6ad;margin:12px 0}.sample-line:nth-child(2){width:74%;background:#739c7e}.sample-line:nth-child(3){width:48%}.sample-caption{font-size:13px;color:#315c3e;margin:0 0 20px}.sample-rule{border-top:1px solid #b0cbb5;padding-top:12px;color:#315c3e;font-size:13px}.empty h3{color:var(--ink);font-size:18px;font-weight:500;margin:0 0 8px}.empty p{margin:0;max-width:320px;font-size:14px}.result-body[hidden],.empty[hidden]{display:none}.status{color:var(--muted);margin:0 0 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222923;color:#edf2ec;border-radius:4px;padding:20px;line-height:1.7;font:13px/1.7 ui-monospace,monospace;max-height:480px;overflow:auto;margin:0}.foot{display:flex;justify-content:space-between;gap:16px;margin-top:20px;color:var(--muted);font-size:12px}@media(max-width:800px){header{padding:0 24px}main{padding:40px 20px}.intro{display:block;margin-bottom:32px}.intro-note{text-align:left;margin-top:20px}.workspace{grid-template-columns:1fr}.form-area,.result-area{padding:24px}.form-area{border-right:0;border-bottom:1px solid var(--line)}.empty{padding:20px 0}.foot{display:block}}
.counts{display:flex;gap:24px;padding:4px 0 24px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}.count strong{display:block;font-size:28px;font-weight:500;line-height:1.2}.count span{font-size:13px;color:var(--muted)}.finding{padding:20px 0;border-bottom:1px solid var(--line)}.finding-head{display:flex;align-items:center;gap:12px;margin-bottom:8px}.severity{font-size:12px;font-weight:600;padding:2px 8px;background:#f3ead2;color:#74550b;border-radius:3px}.severity.error{background:#f6e3df;color:#913b2e}.severity.info{background:#e6ede8;color:#34594a}.finding-title{font-size:15px;font-weight:600}.finding-value{font-size:14px;overflow-wrap:anywhere}.finding-meta{color:var(--muted);font-size:12px;margin-top:8px;overflow-wrap:anywhere}.finding-message{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.raw{margin-top:24px}.raw summary{cursor:pointer;color:var(--muted);font-size:13px;margin-bottom:12px}.target-url{font-size:13px;color:var(--muted);overflow-wrap:anywhere;margin:12px 0}.no-findings{padding:24px 0;color:var(--muted)}.controls{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.controls select{width:auto;min-width:150px;height:44px}.controls button,.copy{min-height:44px;padding:0 16px}.group{border-bottom:1px solid var(--line);padding:16px 0}.group summary{cursor:pointer;font-weight:600}.group .finding{padding:16px;border:0;border-left:2px solid var(--line);margin:12px 0}.preview img{width:100%;height:auto;border:1px solid var(--line)}.preview summary{cursor:pointer;margin:20px 0}.drop{border:1px dashed #9eafa1;padding:16px;margin-top:16px;color:var(--muted);font-size:13px}.drop input{height:auto;border:0;padding:8px 0;background:none}.copy-status{font-size:13px;color:var(--muted)}.hint-error{color:#943f31}.explanation{font-size:13px;color:var(--muted);margin:6px 0}</style></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true"></span><span>ai-design-check</span></div><span class="local">ローカルで実行中</span></header>
<main><div class="intro"><div><h1>デザインチェック</h1><p>Webページやファイルのデザインを確認</p></div></div>
<div class="workspace"><section class="form-area"><div class="section-heading"><span class="number">01</span><h2>チェックする</h2></div><p class="description">対象を選び、URLまたはファイルのパスを入力</p><label for="mode">対象</label><select id="mode"><option value="scan">Webページ</option><option value="file">ローカルファイル</option></select><label for="target" id="label">ページのURL</label><input id="target" placeholder="https://example.com" spellcheck="false"><div class="drop" id="drop" hidden>ファイルを選択、またはここにドラッグ<input type="file" id="file" accept=".html,.htm,.css,.js,.jsx,.ts,.tsx,.vue,.svelte,.swift,.kt,.dart,.php"><span>選択したファイル単体を一時的にチェックします</span></div><p class="hint" id="hint">Chromeでページを表示し、見た目や使いやすさを調べます</p><div class="action"><button id="run">チェックを実行</button><small>ファイルの変更なし</small></div></section>
<section class="result-area"><div class="section-heading"><span class="number">02</span><h2>チェック結果</h2></div><div id="empty" class="empty"><div class="sample" aria-hidden="true"><p class="sample-caption">結果の表示例</p><div class="sample-line"></div><div class="sample-line"></div><div class="sample-line"></div><div class="sample-rule">文字の大きさやコントラストなど</div></div><h3>まだチェックしていません</h3><p>対象を入力してチェックを実行してください</p></div><div class="result-body" id="result" hidden><p class="status" id="status" role="status" aria-live="polite"></p><div id="summary"></div><div id="preview"></div><div class="controls" id="filters" hidden><select id="severity" aria-label="重要度で絞り込む"><option value="">すべての重要度</option><option value="error">エラー</option><option value="warn">警告</option><option value="info">情報</option></select><select id="area" aria-label="種類で絞り込む"><option value="">すべての種類</option></select><button type="button" class="copy" id="copy">結果をコピー</button><span class="copy-status" id="copy-status" role="status"></span></div><div id="findings"></div><details class="raw"><summary>元の出力を見る</summary><pre id="output"></pre></details></div></section></div><div class="foot"><span></span><span>ai-design-check local interface</span></div></main>
<script>
const mode=document.querySelector('#mode'),target=document.querySelector('#target'),run=document.querySelector('#run'),fileInput=document.querySelector('#file'),drop=document.querySelector('#drop'),severity=document.querySelector('#severity'),area=document.querySelector('#area');let selectedFile=null,current=null;
const titles={'no-eyebrow-label':['見出しの上にラベルがあります','ラベルが内容の理解に必要か確認してください'],'legible-contrast':['文字と背景のコントラストが低い可能性があります','文字色か背景色を調整し、読みやすさを確認してください'],'no-tiny-text':['文字が小さい可能性があります','文字サイズを大きくし、画面上で読めるか確認してください'],'no-crushed-tracking':['文字間隔が狭い可能性があります','文字間隔を広げ、読みやすさを確認してください'],'spacing-scale':['余白が指定の間隔から外れています','余白をプロジェクトの基準に合わせるか確認してください'],'type-scale':['文字サイズが指定のスケールから外れています','デザインで決めた文字サイズに合わせるか確認してください'],'radius-scale':['角丸が指定のスケールから外れています','同じ種類の要素で角丸を揃えるか確認してください'],'icons-not-emoji':['絵文字が使われています','必要に応じて統一したアイコンへの変更を検討してください'],'no-ai-gradients':['グラデーションが使われています','デザインの意図に合っているか確認してください'],'input-text-16':['入力欄の文字サイズを確認してください','スマートフォンで読みやすいサイズか確認してください']};
const areas={accessibility:'アクセシビリティ',layout:'レイアウト',visual:'見た目',style:'スタイル',type:'文字',typography:'文字',shape:'形状',motion:'動き',copy:'文章',components:'部品',mobile:'モバイル',color:'色'};
function node(tag,cls,text){const el=document.createElement(tag);if(cls)el.className=cls;if(text!==undefined)el.textContent=text;return el}
mode.onchange=()=>{const file=mode.value==='file';drop.hidden=!file;selectedFile=null;fileInput.value='';target.value='';document.querySelector('#label').textContent=file?'ファイルの絶対パス':'ページのURL';target.placeholder=file?'/Users/name/project/index.html':'https://example.com';document.querySelector('#hint').textContent=file?'パスを入力するか、ファイルを選択してください':'Chromeでページを表示し、見た目や使いやすさを調べます'};
fileInput.onchange=()=>{selectedFile=fileInput.files[0]||null;if(selectedFile)target.value=''};target.oninput=()=>{if(target.value){selectedFile=null;fileInput.value=''}};for(const event of ['dragenter','dragover'])drop.addEventListener(event,e=>e.preventDefault());drop.addEventListener('drop',e=>{e.preventDefault();selectedFile=e.dataTransfer.files[0]||null;if(selectedFile){target.value='';document.querySelector('#hint').textContent=`選択中：${selectedFile.name}`}});
function grouped(){const list=document.querySelector('#findings');list.replaceChildren();const filtered=current.findings.filter(f=>(!severity.value||f.severity===severity.value)&&(!area.value||f.area===area.value));if(!filtered.length){list.append(node('p','no-findings',current.findings.length?'条件に合う指摘はありません':'指摘は見つかりませんでした'));return}const groups=new Map();for(const f of filtered){const key=f.rule||'other';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(f)}for(const [rule,items] of groups){const group=node('details','group');group.open=items.length===1;const label=titles[rule]?.[0]||rule;group.append(node('summary','',`${label}　${items.length}件`));if(titles[rule]?.[1])group.append(node('p','explanation',titles[rule][1]));else group.append(node('p','explanation','詳細は各項目の原文を確認してください'));for(const f of items){const item=node('article','finding'),head=node('div','finding-head');head.append(node('span','severity '+(f.severity||''),f.severity==='error'?'エラー':f.severity==='warn'?'警告':'情報'));item.append(head);if(f.value)item.append(node('div','finding-value',f.value));if(f.message)item.append(node('div','finding-message',f.message));item.append(node('div','finding-meta',[f.path&&`${f.path}${f.line?':'+f.line:''}`,f.rule].filter(Boolean).join('　')));group.append(item)}list.append(group)}}
function show(data,response){current=data;const summary=document.querySelector('#summary'),preview=document.querySelector('#preview');summary.replaceChildren();preview.replaceChildren();const counts=node('div','counts');for(const [label,key] of [['エラー','errors'],['警告','warnings'],['情報','notes']]){const box=node('div','count');box.append(node('strong','',String(data[key]??0)),node('span','',label));counts.append(box)}summary.append(counts);if(data.pages?.[0]?.url)summary.append(node('p','target-url',data.pages[0].url));if(response.uploaded)summary.append(node('p','target-url','選択したファイル単体の結果です。関連ファイルは含まれません'));if(response.screenshot){const d=node('details','preview');d.append(node('summary','','ページのプレビューを見る'));const img=node('img');img.src='data:image/png;base64,'+response.screenshot;img.alt='チェックしたページのプレビュー';d.append(img);preview.append(d)}else if(response.previewError)preview.append(node('p','hint-error','プレビューを取得できませんでした'));if(data.nothingChecked){document.querySelector('#findings').replaceChildren(node('p','no-findings',data.message||'チェックできるファイルがありません'));return}area.replaceChildren(node('option','','すべての種類'));area.firstChild.value='';for(const key of [...new Set(data.findings.map(f=>f.area).filter(Boolean))]){const opt=node('option','',areas[key]||key);opt.value=key;area.append(opt)}severity.value='';document.querySelector('#filters').hidden=false;grouped()}
severity.onchange=grouped;area.onchange=grouped;
document.querySelector('#copy').onclick=async()=>{if(!current)return;const lines=[`エラー ${current.errors??0}件 / 警告 ${current.warnings??0}件 / 情報 ${current.notes??0}件`,current.pages?.[0]?.url||'',...current.findings.map(f=>`${f.severity==='error'?'エラー':f.severity==='warn'?'警告':'情報'}: ${titles[f.rule]?.[0]||f.rule}${f.value?' — '+f.value:''}${f.path?' ('+f.path+(f.line?':'+f.line:'')+')':''}\n${f.message||''}`)];try{await navigator.clipboard.writeText(lines.filter(Boolean).join('\n'));document.querySelector('#copy-status').textContent='コピーしました'}catch{document.querySelector('#copy-status').textContent='コピーできませんでした。元の出力からコピーしてください'}};
function guidance(message){if(/chrome|chromium/i.test(message))return 'Chromeを起動できませんでした。Chromeがインストールされているか確認してください';if(/timeout|timed out/i.test(message))return '時間内に完了しませんでした。URLとネットワークを確認して再実行してください';if(/ENOENT|no such file/i.test(message))return 'ファイルが見つかりません。パスを確認してください';return 'チェックできませんでした。URLやファイルを確認し、元の出力を参照してください'}
run.onclick=async()=>{document.querySelector('#empty').hidden=true;document.querySelector('#result').hidden=false;document.querySelector('#status').textContent='チェック中… ページの確認には時間がかかる場合があります';document.querySelector('#output').textContent='';for(const id of ['summary','findings','preview'])document.querySelector('#'+id).replaceChildren();document.querySelector('#filters').hidden=true;document.querySelector('#copy-status').textContent='';run.disabled=true;try{let upload;if(selectedFile){if(selectedFile.size>8_000_000)throw Error('ファイルは8MB以下にしてください');const bytes=new Uint8Array(await selectedFile.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));upload={name:selectedFile.name,content:btoa(binary)}}const r=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode.value,target:target.value.trim(),upload})});if(!r.ok)throw Error(await r.text());const data=await r.json();document.querySelector('#output').textContent=data.output+(data.stderr?'\n'+data.stderr:'');if(data.data&&Array.isArray(data.data.findings)){show(data.data,data);const pageError=data.data.pages?.find(p=>p.error)?.error;document.querySelector('#status').textContent=data.code===2?guidance(String(pageError||data.stderr||data.output)):'チェック完了';if(data.code===2)document.querySelector('.raw').open=true}else{document.querySelector('#status').textContent=guidance(data.output);document.querySelector('.raw').open=true}}catch(e){document.querySelector('#status').textContent=e.message;document.querySelector('.raw').open=true}finally{run.disabled=false}};
</script></body></html>
