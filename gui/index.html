<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ai-design-check</title>
<style>
:root{color-scheme:light;--ink:#222823;--muted:#59625c;--line:#d9dfd9;--paper:#f7f8f5;--accent:#236047;--accent-light:#e0efe4}
*{box-sizing:border-box}body{margin:0;background:#eef0ed;color:var(--ink);font-family: -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;font-size:15px;line-height:1.6}button,input,select{font:inherit}button,input,select{outline-offset:3px}a{color:inherit}header{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 40px;background:var(--paper)}.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:-.02em}.mark{width:28px;height:28px;border:1.5px solid var(--accent);position:relative}.mark:after{content:"";position:absolute;left:7px;top:4px;width:8px;height:13px;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(40deg)}.local{font-size:13px;color:var(--muted)}main{max-width:1440px;margin:auto;padding:64px 40px 80px}.intro{display:flex;justify-content:space-between;align-items:end;gap:32px;margin-bottom:48px}.intro h1{font-size:clamp(32px,4vw,48px);font-weight:500;letter-spacing:-.04em;line-height:1.3;margin:0}.intro p{margin:12px 0 0;color:var(--muted)}.intro-note{font-size:13px;color:var(--muted);text-align:right}.workspace{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);border:1px solid #ccd4cc;background:var(--paper);min-height:470px}.form-area,.result-area{padding:40px}.form-area{border-right:1px solid var(--line)}.section-heading{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:32px}.section-heading .number{font:13px ui-monospace,monospace;color:var(--accent)}h2{font-size:20px;font-weight:500;margin:0}.description{color:var(--muted);margin:-12px 0 28px}label{display:block;font-weight:600;font-size:14px;margin:24px 0 8px}select,input{display:block;width:100%;height:52px;padding:0 16px;color:var(--ink);background:white;border:1px solid #bbc6bc;border-radius:4px}input::placeholder{color:#7b857e}.hint{font-size:13px;color:var(--muted);margin:8px 0 0;min-height:24px}.action{display:flex;align-items:center;gap:20px;margin-top:40px}button{min-height:52px;padding:0 28px;border:0;border-radius:4px;background:var(--accent);color:white;font-weight:600;cursor:pointer}button:hover{background:#174c36}button:disabled{opacity:.55;cursor:wait}.action small{color:var(--muted)}.result-area{display:flex;flex-direction:column}.empty{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;color:var(--muted)}.sample{width:100%;max-width:320px;border:1px solid #c8d8cb;background:#e7f0e8;padding:20px;margin-bottom:28px}.sample-line{height:8px;background:#a5c6ad;margin:12px 0}.sample-line:nth-child(2){width:74%;background:#739c7e}.sample-line:nth-child(3){width:48%}.sample-caption{font-size:13px;color:#315c3e;margin:0 0 20px}.sample-rule{border-top:1px solid #b0cbb5;padding-top:12px;color:#315c3e;font-size:13px}.empty h3{color:var(--ink);font-size:18px;font-weight:500;margin:0 0 8px}.empty p{margin:0;max-width:320px;font-size:14px}.result-body[hidden],.empty[hidden]{display:none}.status{color:var(--muted);margin:0 0 16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222923;color:#edf2ec;border-radius:4px;padding:20px;line-height:1.7;font:13px/1.7 ui-monospace,monospace;max-height:480px;overflow:auto;margin:0}.foot{display:flex;justify-content:space-between;gap:16px;margin-top:20px;color:var(--muted);font-size:12px}@media(max-width:800px){header{padding:0 24px}main{padding:40px 20px}.intro{display:block;margin-bottom:32px}.intro-note{text-align:left;margin-top:20px}.workspace{grid-template-columns:1fr}.form-area,.result-area{padding:24px}.form-area{border-right:0;border-bottom:1px solid var(--line)}.empty{padding:20px 0}.foot{display:block}}
</style></head>
<body><header><div class="brand"><span class="mark" aria-hidden="true"></span><span>ai-design-check</span></div><span class="local">ローカルで実行中</span></header>
<main><div class="intro"><div><h1>デザインチェック</h1><p>Webページやファイルのデザインを確認</p></div></div>
<div class="workspace"><section class="form-area"><div class="section-heading"><span class="number">01</span><h2>チェックする</h2></div><p class="description">対象を選び、URLまたはファイルのパスを入力</p><label for="mode">対象</label><select id="mode"><option value="scan">Webページ</option><option value="file">ローカルファイル</option></select><label for="target" id="label">ページのURL</label><input id="target" placeholder="https://example.com" spellcheck="false"><p class="hint" id="hint">Chromeでページを表示し、見た目や使いやすさを調べます</p><div class="action"><button id="run">チェックを実行</button><small>ファイルの変更なし</small></div></section>
<section class="result-area"><div class="section-heading"><span class="number">02</span><h2>チェック結果</h2></div><div id="empty" class="empty"><div class="sample" aria-hidden="true"><p class="sample-caption">結果の表示例</p><div class="sample-line"></div><div class="sample-line"></div><div class="sample-line"></div><div class="sample-rule">文字の大きさやコントラストなど</div></div><h3>まだチェックしていません</h3><p>対象を入力してチェックを実行してください</p></div><div class="result-body" id="result" hidden><p class="status" id="status" role="status" aria-live="polite"></p><pre id="output"></pre></div></section></div><div class="foot"><span></span><span>ai-design-check local interface</span></div></main>
<script>
const mode=document.querySelector('#mode'),target=document.querySelector('#target'),run=document.querySelector('#run');mode.onchange=()=>{const file=mode.value==='file';document.querySelector('#label').textContent=file?'ファイルの絶対パス':'ページのURL';target.placeholder=file?'/Users/name/project/index.html':'https://example.com';document.querySelector('#hint').textContent=file?'指定したファイルのコードを調べます':'Chromeでページを表示し、見た目や使いやすさを調べます'};run.onclick=async()=>{document.querySelector('#empty').hidden=true;document.querySelector('#result').hidden=false;document.querySelector('#status').textContent='チェック中…';document.querySelector('#output').textContent='';run.disabled=true;try{const r=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode.value,target:target.value.trim()})});if(!r.ok)throw Error(await r.text());const data=await r.json();document.querySelector('#status').textContent=data.code===0?'チェックが完了しました':`終了コード ${data.code}：結果を確認してください`;document.querySelector('#output').textContent=data.output}catch(e){document.querySelector('#status').textContent='実行できませんでした';document.querySelector('#output').textContent=e.message}finally{run.disabled=false}};
</script></body></html>
