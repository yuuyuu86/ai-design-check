<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Design Check</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#17231f;font:16px -apple-system,BlinkMacSystemFont,sans-serif}main{max-width:820px;margin:70px auto;padding:0 24px}.tag{font-size:12px;letter-spacing:.12em;color:#557365}h1{font-size:clamp(38px,7vw,64px);letter-spacing:-.04em;margin:18px 0 8px}p{line-height:1.7;color:#58655e}.panel{background:white;border:1px solid #dce2dc;border-radius:18px;padding:28px;margin-top:32px;box-shadow:0 12px 40px #253c3010}label{display:block;font-weight:600;margin:20px 0 8px}select,input{width:100%;padding:14px;border:1px solid #bfcac1;border-radius:8px;font:inherit;background:white}button{background:#174f3b;color:white;border:0;border-radius:8px;padding:14px 24px;font:inherit;font-weight:600;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#14251d;color:#e7f2e9;border-radius:10px;padding:20px;line-height:1.6;font-size:13px}small{color:#68756d}
</style><main><div class="tag">AI DESIGN CHECK / LOCAL GUI</div><h1>デザインを、<br>確かめよう。</h1><p>ページの表示やコードをチェックして、改善のヒントを見つけます。</p><section class="panel"><label for="mode">チェックする対象</label><select id="mode"><option value="scan">公開中のWebページ</option><option value="file">ローカルファイル</option></select><label for="target" id="label">ページのURL</label><input id="target" placeholder="https://example.com" spellcheck="false"><p><small id="hint">Chromeを使って、実際に表示されたページを調べます。</small></p><button id="run">チェックする →</button></section><section id="result" class="panel" hidden><h2>チェック結果</h2><p id="status" role="status"></p><pre id="output"></pre></section></main><script>
const mode=document.querySelector('#mode'), target=document.querySelector('#target'), run=document.querySelector('#run');mode.onchange=()=>{let file=mode.value==='file';document.querySelector('#label').textContent=file?'ファイルの絶対パス':'ページのURL';target.placeholder=file?'/Users/name/project/index.html':'https://example.com';document.querySelector('#hint').textContent=file?'指定したファイルのコードを調べます。':'Chromeを使って、実際に表示されたページを調べます。'};run.onclick=async()=>{document.querySelector('#result').hidden=false;document.querySelector('#status').textContent='チェック中…';document.querySelector('#output').textContent='';run.disabled=true;try{let r=await fetch('/check',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:mode.value,target:target.value.trim()})});if(!r.ok)throw Error(await r.text());let data=await r.json();document.querySelector('#status').textContent=data.code===0?'完了しました':`終了コード ${data.code}（結果を確認してください）`;document.querySelector('#output').textContent=data.output}catch(e){document.querySelector('#status').textContent='実行できませんでした';document.querySelector('#output').textContent=e.message}finally{run.disabled=false}};
</script></html>
